name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      benchmarks: ${{ steps.classify.outputs.benchmarks }}
      site: ${{ steps.classify.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            files="$(git ls-tree -r --name-only "$head")"
          else
            files="$(git diff --name-only "$base" "$head")"
          fi

          rust=false
          benchmarks=false
          site=false

          if [[ -z "$files" ]]; then
            rust=true
            benchmarks=true
            site=true
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              .github/workflows/*)
                rust=true
                benchmarks=true
                site=true
                ;;
              Cargo.toml|Cargo.lock|crates/*|scripts/*)
                rust=true
                ;;
              benchmarks/*)
                benchmarks=true
                ;;
              docs/*|brand/*|README.md|ARCHITECTURE.md|BACKENDS.md|CONTRIBUTING.md|INTEGRATION.md|RELEASE.md|THIRD_PARTY.md|TRANSFORMER.md|USAGE.md|eleventy.config.js|package.json|package-lock.json)
                site=true
                ;;
              *)
                rust=true
                benchmarks=true
                site=true
                ;;
            esac
          done <<< "$files"

          {
            echo "rust=$rust"
            echo "benchmarks=$benchmarks"
            echo "site=$site"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features --locked

  lint:
    name: Format and lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  benchmark-scripts:
    name: Benchmark script tests
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.13 --with requests --with remotezip python -m unittest discover -s benchmarks -p 'test_*.py'
      - run: uv run --no-project --python 3.13 python -m unittest discover -s benchmarks/baselines -p 'test_*.py'

  site:
    name: Build website
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  size:
    name: Release binary size
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/measure-binary-size.sh
