<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">key lime reranker flow</title>
  <desc id="desc">Audio produces chroma frames and DSP key scores. A compact transformer reranker reads both and writes the selected key, estimator name, and DSP prior.</desc>
  <defs>
    <style>
      .box { fill: none; stroke: #5a403a; stroke-width: 3; }
      .feature { fill: none; stroke: #765f7b; stroke-width: 3.5; }
      .accent { fill: none; stroke: #a33d52; stroke-width: 3.5; }
      .tagbox { fill: #765f7b; }
      .pill { fill: #a93649; }
      .arrow { fill: none; stroke: #5a403a; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; }
      .label { fill: #171517; font: 500 21px "DM Sans", Arial, sans-serif; }
      .body { fill: #5a403a; font: 500 21px "DM Sans", Arial, sans-serif; }
      .mono { fill: #5d4861; font: 400 21px "DM Mono", ui-monospace, monospace; }
      .tag { fill: #ffffff; font: 500 21px "DM Sans", Arial, sans-serif; }
      .cap { fill: #5a403a; font: 500 21px "DM Sans", Arial, sans-serif; }
    </style>
    <marker id="ah" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a403a" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect class="box" x="28" y="58" width="154" height="70" rx="0"/>
  <text class="label" x="105" y="88" text-anchor="middle">PCM</text>
  <text class="body" x="105" y="112" text-anchor="middle">mono samples</text>

  <path class="arrow" d="M182 93 L222 93" marker-end="url(#ah)"/>

  <rect class="feature" x="222" y="24" width="230" height="74" rx="0"/>
  <text class="label" x="250" y="58">chroma frames</text>
  <text class="body" x="250" y="81">12 bins by frame</text>

  <rect class="feature" x="222" y="142" width="230" height="74" rx="0"/>
  <text class="label" x="250" y="176">DSP key scores</text>
  <text class="body" x="250" y="199">24 key candidates</text>

  <path class="arrow" d="M452 61 L504 61 L504 113 L540 113" marker-end="url(#ah)"/>
  <path class="arrow" d="M452 179 L504 179 L504 143 L540 143" marker-end="url(#ah)"/>

  <rect class="tagbox" x="584" y="48" width="138" height="28" rx="0"/>
  <text class="tag" x="653" y="68" text-anchor="middle">21,528 params</text>

  <rect class="accent" x="540" y="88" width="300" height="120" rx="0"/>
  <text class="label" x="568" y="126">transformer reranker</text>
  <text class="body" x="568" y="152">one encoder layer</text>
  <text class="body" x="568" y="172">Rust forward pass</text>
  <text class="body" x="568" y="194">selected global key</text>
</svg>
