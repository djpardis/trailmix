  <!-- Row 4 (oct 3) -->
  <rect x="81" y="146" width="48" height="24" rx="3" fill="#a33d52" opacity="0.4"/>
  <rect x="144" y="146" width="48" height="24" rx="3" fill="#f0e8df"/>
  <rect x="207" y="146" width="48" height="24" rx="3" fill="#a33d52" opacity="0.25"/>
  <rect x="270" y="146" width="48" height="24" rx="3" fill="#f0e8df"/>
