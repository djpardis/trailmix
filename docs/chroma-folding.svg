  <rect x="396" y="38" width="48" height="24" rx="3" fill="#f0e8df"/>
  <rect x="459" y="38" width="48" height="24" rx="3" fill="#f0e8df"/>
  <rect x="522" y="38" width="48" height="24" rx="3" fill="#a33d52" opacity="0.25"/>
  <rect x="585" y="38" width="48" height="24" rx="3" fill="#f0e8df"/>
  <rect x="648" y="38" width="48" height="24" rx="3" fill="#f0e8df"/>
