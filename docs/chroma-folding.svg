<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="Chroma folding across octaves">

  <!-- Pitch class labels -->
  <text x="105" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">C</text>
  <text x="168" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">C♯</text>
  <text x="231" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">D</text>
  <text x="294" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">D♯</text>
  <text x="357" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">E</text>
  <text x="420" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">F</text>
  <text x="483" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">F♯</text>
  <text x="546" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">G</text>
  <text x="609" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">G♯</text>
  <text x="672" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">A</text>
  <text x="735" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">A♯</text>
  <text x="798" y="22" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">B</text>

  <!-- Octave row labels -->
  <text x="52" y="54" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="end">oct 6</text>
  <text x="52" y="90" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="end">oct 5</text>
  <text x="52" y="126" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="end">oct 4</text>
  <text x="52" y="162" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="end">oct 3</text>

  <!-- Grid: 12 columns x 4 rows, C-major-ish -->
