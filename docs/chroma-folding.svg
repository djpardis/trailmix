  <rect x="774" y="146" width="48" height="24" rx="3" fill="#f0e8df"/>

  <!-- Fold annotation -->
  <text x="450" y="198" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">fold octaves ↓</text>

  <!-- Chroma bar chart -->
  <rect x="84" y="222" width="42" height="120" fill="#a33d52"/>
  <rect x="147" y="338" width="42" height="4" fill="#b5a08e"/>
  <rect x="210" y="322" width="42" height="20" fill="#a33d52" opacity="0.5"/>
  <rect x="273" y="338" width="42" height="4" fill="#b5a08e"/>
  <rect x="336" y="252" width="42" height="90" fill="#a33d52"/>
  <rect x="399" y="330" width="42" height="12" fill="#a33d52" opacity="0.4"/>
  <rect x="462" y="338" width="42" height="4" fill="#b5a08e"/>
  <rect x="525" y="242" width="42" height="100" fill="#a33d52"/>
  <rect x="588" y="338" width="42" height="4" fill="#b5a08e"/>
  <rect x="651" y="322" width="42" height="20" fill="#a33d52" opacity="0.5"/>
  <rect x="714" y="338" width="42" height="4" fill="#b5a08e"/>
  <rect x="777" y="332" width="42" height="10" fill="#a33d52" opacity="0.4"/>

  <text x="105" y="360" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">C</text>
  <text x="357" y="360" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">E</text>
  <text x="546" y="360" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a" text-anchor="middle">G</text>

  <text x="36" y="386" font-family="DM Sans, Arial, sans-serif" font-size="21" fill="#5a403a">Strong C, E, G bins match the C major Krumhansl-Kessler profile.</text>
