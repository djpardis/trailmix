  <rect x="459" y="74" width="48" height="24" rx="3" fill="#f0e8df"/>
  <rect x="522" y="74" width="48" height="24" rx="3" fill="#a33d52" opacity="0.6"/>
  <rect x="585" y="74" width="48" height="24" rx="3" fill="#f0e8df"/>
  <rect x="648" y="74" width="48" height="24" rx="3" fill="#a33d52" opacity="0.25"/>
  <rect x="711" y="74" width="48" height="24" rx="3" fill="#f0e8df"/>
  <rect x="774" y="74" width="48" height="24" rx="3" fill="#f0e8df"/>

  <!-- Row 3 (oct 4) -->
  <rect x="81" y="110" width="48" height="24" rx="3" fill="#a33d52" opacity="0.9"/>
  <rect x="144" y="110" width="48" height="24" rx="3" fill="#f0e8df"/>
  <rect x="207" y="110" width="48" height="24" rx="3" fill="#a33d52" opacity="0.25"/>
  <rect x="270" y="110" width="48" height="24" rx="3" fill="#f0e8df"/>
  <rect x="333" y="110" width="48" height="24" rx="3" fill="#a33d52" opacity="0.7"/>
  <rect x="396" y="110" width="48" height="24" rx="3" fill="#a33d52" opacity="0.25"/>
  <rect x="459" y="110" width="48" height="24" rx="3" fill="#f0e8df"/>
  <rect x="522" y="110" width="48" height="24" rx="3" fill="#a33d52" opacity="0.8"/>
