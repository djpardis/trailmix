<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="trail mix crate architecture">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#5a403a" stroke-width="1.6"/>
    </marker>
    <style>
      .box { fill: none; stroke: #5a403a; stroke-width: 2.6; }
      .facade { fill: none; stroke: #a33d52; stroke-width: 2.8; }
      .analyzer { fill: none; stroke: #765f7b; stroke-width: 2.6; }
      .arrow { fill: none; stroke: #5a403a; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .title { font: 500 21px "DM Sans", Arial, sans-serif; fill: #171517; }
      .muted { font: 500 21px "DM Sans", Arial, sans-serif; fill: #5a403a; }
      .mono { font: 400 21px "DM Mono", ui-monospace, monospace; fill: #5d4861; }
      .crate { font: 700 21px "DM Mono", ui-monospace, monospace; fill: #a33d52; }
      .cap { font: 500 21px "DM Sans", Arial, sans-serif; fill: #8a5a3c; letter-spacing: 0.02em; }
    </style>
  </defs>

  <text class="cap" x="48" y="42">INPUT</text>
  <rect class="box" x="48" y="62" width="186" height="74"/>
  <text class="title" x="78" y="96">audio file</text>
  <text class="muted" x="78" y="118">optional</text>

  <path class="arrow" d="M234 99 L300 99"/>

  <rect class="box" x="300" y="62" width="246" height="74"/>
  <text class="crate" x="330" y="96">trailmix-codecs</text>
  <text class="muted" x="330" y="118">decode when needed</text>

  <path class="arrow" d="M546 99 L592 99"/>

  <rect class="box" x="592" y="62" width="260" height="74"/>
  <text class="title" x="622" y="96">AudioBuffer + config</text>
  <text class="muted" x="622" y="118">app code starts here</text>

  <path class="arrow" d="M732 136 L732 182"/>
  <path class="arrow" d="M732 182 L258 182 L258 242"/>
  <path class="arrow" d="M732 182 L842 182 L842 242"/>

  <text class="cap" x="48" y="222">ONE CALL</text>
  <rect class="facade" x="48" y="242" width="420" height="92"/>
  <text class="crate" x="78" y="282">trailmix::analyze</text>
  <text class="mono" x="78" y="310">Analysis</text>

  <text class="cap" x="528" y="222">USE SEPARATELY</text>
  <rect class="box" x="528" y="242" width="324" height="260"/>

  <rect class="analyzer" x="558" y="274" width="264" height="56"/>
  <text class="crate" x="588" y="297">beat-salad</text>
  <text class="mono" x="588" y="320">BeatAnalysis</text>

  <rect class="analyzer" x="558" y="354" width="264" height="56"/>
  <text class="crate" x="588" y="377">key-lime</text>
  <text class="mono" x="588" y="400">KeyAnalysis</text>

  <rect class="analyzer" x="558" y="434" width="264" height="56"/>
  <text class="crate" x="588" y="457">sampler-platter</text>
  <text class="mono" x="588" y="480">WaveformOverview</text>
</svg>
