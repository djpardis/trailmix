  <path class="wave-line" d="M36 158 C58 206, 82 211, 104 166 C126 210, 148 226, 170 162 C194 226, 222 232, 246 172 C270 198, 296 206, 328 166"/>

  <path class="arrow" d="M360 158 L430 158"/>

