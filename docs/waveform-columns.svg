<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Waveform overview columns">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a403a" stroke-width="1.2"/>
    </marker>
    <style>
      .label { font: 500 21px "DM Sans", Arial, sans-serif; fill: #171517; }
      .body { font: 500 21px "DM Sans", Arial, sans-serif; fill: #5a403a; }
      .caption { font: 500 21px "DM Sans", Arial, sans-serif; fill: #5a403a; }
      .wave-fill { fill: #a33d52; opacity: 0.18; }
      .wave-line { fill: none; stroke: #a33d52; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
      .axis { fill: none; stroke: #e7ded2; stroke-width: 2; }
      .column { fill: none; stroke: #a33d52; stroke-width: 9; stroke-linecap: square; }
      .rms { fill: none; stroke: #5a403a; stroke-width: 2; stroke-dasharray: 5,5; }
      .arrow { fill: none; stroke: #5a403a; stroke-width: 2.2; marker-end: url(#a); }
    </style>
