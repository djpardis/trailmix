[package]
name = "test-kitchen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8.9"
open = "5.4.0"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7.19", features = ["io"] }
trailmix = { version = "0.1.0", path = "../trailmix" }
trailmix-codecs = { version = "0.1.0", path = "../trailmix-codecs", features = ["common-codecs"] }
trailmix-manifest = { version = "0.1.0", path = "../trailmix-manifest" }

[lints]
workspace = true
