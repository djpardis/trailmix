[package]
name = "trailmix-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
cueport-db = ["dep:rusqlite"]

[dependencies]
beat-salad = { path = "../beat-salad", features = ["onnx-beat"] }
key-lime = { path = "../key-lime" }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
rayon = "1"
rusqlite = { version = "0.40.2", optional = true, features = ["bundled"] }
sampler-platter = { path = "../sampler-platter" }
serde.workspace = true
serde_json = "1"
sha2 = "0.11.0"
trailmix = { path = "../trailmix" }
trailmix-codecs = { version = "0.1.0", path = "../trailmix-codecs", features = ["common-codecs"] }
trailmix-manifest = { version = "0.1.0", path = "../trailmix-manifest" }

[lints]
workspace = true

[dev-dependencies]
hound = "3.5.1"
